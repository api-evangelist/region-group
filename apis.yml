name: Region Group

description: 'Region Group (ASX: RGN) is an Australian real estate investment trust that owns and manages a geographically
  diverse portfolio of convenience-based, supermarket-led essential retail shopping centres across Queensland, New South Wales,
  Victoria, South Australia, Western Australia and Tasmania. The responsible entity is Region RE Limited (ACN 158 809 851),
  and the group is a stapled structure of Region Management Trust and Region Retail Trust (formerly SCA Property Group). Its
  website publishes portfolio, investor, sustainability and ASX announcement information; no public API, developer portal
  or API documentation was found on regiongroup.au.'

